<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar — Ritmo</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/auth.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Ritmo</h1>
    <h2>Entrar</h2>

    <form id="auth-form" class="auth-form" data-endpoint="/api/auth/login">
      <label for="identifier">Usuário ou e-mail</label>
      <input id="identifier" name="identifier" type="text" autocomplete="username" maxlength="254" required>

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>

      <button type="submit">Entrar</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <p class="auth-switch">Não tem conta? <a href="/register">Criar conta</a></p>
  </main>
</body>
</html>
